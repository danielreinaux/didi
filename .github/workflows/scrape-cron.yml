name: Scrape + Classify (Sundek + Ville)

# Horários em UTC. Brasil = UTC-3.
# Cadência: a cada 40 min, das 07:00 às 19:40 BRT (a última do dia é 19:40 — a próxima
# do ritmo cairia 20:20, já fora da janela). Cron não expressa "40 em 40" numa linha só
# (40 não divide 60), então são 3 linhas agrupadas por minuto; o efeito é um ritmo
# uniforme de 40 min. Todos os dias. Horários BRT que dispara:
#   07:00 07:40 08:20 09:00 09:40 10:20 11:00 11:40 12:20 13:00
#   13:40 14:20 15:00 15:40 16:20 17:00 17:40 18:20 19:00 19:40   (20 rodadas/dia)
on:
  schedule:
    - cron: '0 10,12,14,16,18,20,22 * * *'   # :00 das horas ímpares BRT (07,09,11,13,15,17,19h)
    - cron: '40 10,12,14,16,18,20,22 * * *'  # :40 das horas ímpares BRT (07:40 … 19:40)
    - cron: '20 11,13,15,17,19,21 * * *'     # :20 das horas pares BRT (08:20 … 18:20)
  workflow_dispatch:        # permite disparar manual também

permissions:
  contents: write            # pra commitar os JSONs de dados de volta no repo

jobs:
  sundek:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: scrape-sundek
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape Sundek
        env:
          HEADLESS: 'true'
        run: python -m src.scrape.sundek

      - name: Classify Sundek
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.classify.run --workers 2

      # Revisita itens do acervo que sumiram do scrape e marca os vendidos/removidos.
      # Sem OpenAI — só scraping. if:always() pra rodar mesmo se o classify falhar.
      - name: Verifica vendidos
        if: always()
        env:
          HEADLESS: 'true'
        run: python -m src.scrape.verifica_vendidos --max 80

      - name: Build analise.html + items de votação
        if: always()
        run: |
          python -m src.build.analise
          # Copia o analise.html fresco pra pasta publicada (antes isso era feito
          # dentro do passo de deploy, que foi removido — o deploy agora é único, no
          # job 'deploy' do fim, e publica o que estiver commitado em votacao/public/).
          cp data/analise.html votacao/public/analise.html
          python -m src.build.votacao_items   # gera votacao/public/items.json (só compráveis+barganha)

      # A notificação por email saiu daqui: agora é UM email consolidado (Sundek + Ville)
      # no job 'deploy' do fim, depois que o items.json combinado já está commitado.

      # if: always() → persiste o checkpoint do classify mesmo se um passo anterior
      # falhar ou o job estourar o timeout (senão o progresso de ~1-3h se perde).
      - name: Commit dados de volta no repo
        if: always()
        run: |
          git config user.name "Didi Bot"
          git config user.email "bot@didi.local"
          git add data/coleta.json data/coleta-classificada.json data/historico.json data/custo_por_etapa.json data/analise.html votacao/public/analise.html votacao/public/items.json
          git diff --cached --quiet && echo "nada a commitar" && exit 0
          git commit -m "data: cron sundek $(date -u +'%Y-%m-%d %H:%M UTC')"
          # O job dura 1-3h; outro run pode ter empurrado pro main nesse meio-tempo.
          # Rebase antes do push e tenta de novo (evita 'rejected: fetch first').
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push falhou (tentativa $i/3) — refazendo rebase em 5s..."
            sleep 5
          done
          echo "::error::não consegui empurrar os dados após 3 tentativas"
          exit 1

  # Vilebrequin: mesma cadência do Sundek, agora EM PARALELO com ele (sem needs).
  # Antes tinha `needs: sundek` pra não competir cota de OpenAI, mas a conta hoje está
  # bem acima do Tier 1 (ver ratelimit.py: ~450K TPM, 5000 req/min) — os dois jobs
  # juntos nem chegam perto do teto, então soltamos pra cortar ~metade do tempo total.
  # Cada um commita arquivos diferentes (coleta.json vs coleta-ville.json) e o push tem
  # rebase+retry, então rodar junto não conflita. O deploy segue needs:[sundek, ville].
  ville:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: scrape-ville
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape Ville
        env:
          HEADLESS: 'true'
        run: python -m src.scrape.ville

      - name: Classify Ville
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.classify.ville_run --workers 2

      # analise_ville = página de auditoria (sem IA, barato) — fica só no repo.
      # oferta_ville  = página de votação do Marcos (votacao/public/oferta_ville.html).
      # votacao_items = items.json dos cards Next.js; JÁ junta Sundek + Ville numa só.
      - name: Build analise-ville + oferta_ville + items de votação
        if: always()
        run: |
          python -m src.build.analise_ville
          python -m src.build.oferta_ville
          python -m src.build.votacao_items

      # (notificação consolidada Sundek+Ville movida pro job 'deploy' do fim)

      # if: always() → persiste o checkpoint do classify mesmo se um passo anterior
      # falhar ou o job estourar o timeout (senão o progresso se perde).
      - name: Commit dados de volta no repo
        if: always()
        run: |
          git config user.name "Didi Bot"
          git config user.email "bot@didi.local"
          git add data/coleta-ville.json data/coleta-ville-classificada.json data/analise-ville.html votacao/public/items.json votacao/public/oferta_ville.html
          # Custo é opcional: se o ville_run quebrou antes de gravar o custo_ville.json,
          # NÃO deixa o git add abortar o step (senão perde o checkpoint dos dados).
          git add data/custo_ville.json 2>/dev/null || true
          git diff --cached --quiet && echo "nada a commitar" && exit 0
          git commit -m "data: cron ville $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Sundek pode ter empurrado pro main nesse meio-tempo.
          # Rebase antes do push e tenta de novo (evita 'rejected: fetch first').
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push falhou (tentativa $i/3) — refazendo rebase em 5s..."
            sleep 5
          done
          echo "::error::não consegui empurrar os dados após 3 tentativas"
          exit 1

  # Deploy ÚNICO no fim. Antes cada job (sundek e ville) rodava `vercel --prod` e os
  # dois davam alias no mesmo domínio (votacao-two), então o último a terminar vencia.
  # Pior: o ville fazia checkout do github.sha (commit que disparou o run), NÃO do
  # commit fresco que o sundek tinha acabado de empurrar — então deployava analise.html
  # velho e um items.json montado em cima de coleta-classificada DESATUALIZADA (com 0
  # compráveis virava []), sobrescrevendo o deploy bom do sundek. Resultado: repo com
  # dado, site vazio. Aqui consolidamos: 1 deploy só, depois dos dois jobs, partindo do
  # main JÁ atualizado (ref: main puxa o tip com os commits dos dois). Publica exatamente
  # o que está commitado em votacao/public/ (items.json combinado + analise.html + oferta_ville).
  #
  # Também manda UM email consolidado (Sundek + Ville). Antes cada job notificava sua
  # marca → 2 emails; aqui o `notify.run` SEM --marca lê o items.json combinado e manda
  # um resumo único, depois grava+commita o ledger data/notificados.json.
  deploy:
    needs: [sundek, ville]
    if: always()           # publica o último estado commitado mesmo se um job falhar
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-votacao
      cancel-in-progress: false
    steps:
      - name: Checkout main atualizado
        uses: actions/checkout@v4
        with:
          ref: main        # tip atual do main (com os commits desta rodada), não o github.sha
          fetch-depth: 1

      # Python já montado aqui pra servir o snapshot do histórico E a notificação
      # (ambos são stdlib puro — não precisam de pip install).
      - name: Setup Python 3.12
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Gera o snapshot DESTA rodada pro /history ANTES do deploy, pra o Vercel já
      # publicar o histórico atualizado. run_id = $GITHUB_RUN_ID (1 arquivo por run;
      # o index guarda as últimas N e o builder poda os órfãos). Modo working-tree:
      # lê os JSONs que os jobs sundek/ville acabaram de commitar.
      - name: Snapshot do histórico da rodada (/history)
        if: always()
        run: python -m src.build.history

      # Commita o snapshot pra ele persistir no repo (dev local + próxima rodada leem
      # o index de lá). O deploy abaixo publica o working-tree, então mesmo sem commit
      # o Vercel já subiria; o commit é pra durar.
      - name: Commit do snapshot do histórico
        if: always()
        run: |
          git config user.name "Didi Bot"
          git config user.email "bot@didi.local"
          git add -A votacao/public/history
          git diff --cached --quiet && echo "nada a commitar" && exit 0
          git commit -m "data: history $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push falhou (tentativa $i/3) — refazendo rebase em 5s..."
            sleep 5
          done
          echo "::error::não consegui empurrar o histórico após 3 tentativas"
          exit 1

      - name: Deploy no Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_KEY }}
          # IDs do projeto Vercel "votacao" (publicado em votacao-two.vercel.app).
          # OBRIGATÓRIOS no CI: a pasta .vercel/ é gitignored e NÃO vem no checkout,
          # então sem eles o `vercel --prod` não sabe pra qual projeto publicar.
          VERCEL_ORG_ID: team_m72m6r8zJFJfCmPq0cUZrGbt
          VERCEL_PROJECT_ID: prj_FljhhdpJqaicpJ6ywAOfurCawmkQ
        run: |
          cd votacao
          npx vercel --prod --token="$VERCEL_TOKEN" --yes
          # ↑ a env var ainda é VERCEL_TOKEN porque é o nome que a CLI espera;
          # o valor vem do secret VERCEL_KEY que você cadastrou.

      # (Python já foi montado no começo do job, antes do snapshot do histórico.)
      # UM email só, com as duas marcas. Sem --marca, o run.py lê o items.json combinado
      # e manda um resumo único (assunto "Sundek+Ville"). Seed pelo ledger global.
      - name: Notificar por email (Sundek + Ville)
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python -m src.notify.run

      # O notify gravou o ledger atualizado; commita de volta pra deduplicar na próxima.
      - name: Commit do ledger de notificações
        if: always()
        run: |
          git config user.name "Didi Bot"
          git config user.email "bot@didi.local"
          git add data/notificados.json
          git diff --cached --quiet && echo "nada a commitar" && exit 0
          git commit -m "data: notificados $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push falhou (tentativa $i/3) — refazendo rebase em 5s..."
            sleep 5
          done
          echo "::error::não consegui empurrar o ledger após 3 tentativas"
          exit 1
