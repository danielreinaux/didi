<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sundek Radar</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --ink: #1a1f2b;
    --ink-soft: #5c6673;
    --ink-mute: #97a0ad;
    --accent: #ff5c3a;
    --border: #e9e7e1;
    --border-soft: #f0eee8;
    --bubble: #eceae3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font: inherit; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
  }

  /* header */
  .hdr {
    padding: 18px 24px 14px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .hdr .title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .hdr .sub {
    font-size: 12px;
    color: var(--ink-mute);
    margin-top: 2px;
  }

  /* chat */
  .scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* user bubble (right) */
  .me { display: flex; justify-content: flex-end; }
  .me .bubble {
    background: var(--bubble);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 18px 18px 4px 18px;
    max-width: 80%;
    font-size: 15px;
  }

  /* reply (left, no bubble, no avatar) */
  .reply {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 92%;
  }
  .reply .text {
    font-size: 15px;
    color: var(--ink);
    line-height: 1.55;
  }
  .reply .text strong { color: var(--ink); font-weight: 600; }
  .reply .text .hl {
    background: linear-gradient(transparent 60%, #ffe0d7 60%);
    padding: 0 2px;
  }
  .reply .meta {
    font-size: 12px;
    color: var(--ink-mute);
  }

  /* product cards inline */
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .pcard {
    display: flex;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, box-shadow .15s;
    align-items: center;
  }
  .pcard:hover {
    border-color: #d5d1c6;
    box-shadow: 0 4px 14px rgba(26,31,43,.05);
  }
  .pcard .thumb {
    width: 64px; height: 64px;
    border-radius: 10px;
    flex-shrink: 0;
    position: relative;
  }
  .pcard .thumb .badge {
    position: absolute;
    bottom: -4px; right: -4px;
    background: var(--accent);
    color: #fff;
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    border: 2px solid var(--surface);
  }
  .pcard .thumb .badge.novo { background: #16a34a; }
  .pcard .info { flex: 1; min-width: 0; }
  .pcard .title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .pcard .meta-row {
    font-size: 12px;
    color: var(--ink-mute);
    display: flex; gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .pcard .meta-row .dot { color: #cfcbbf; }
  .pcard .meta-row .src { color: var(--ink-soft); }
  .pcard .price-col {
    text-align: right;
    flex-shrink: 0;
  }
  .pcard .price {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }
  .pcard .price-old {
    display: block;
    text-decoration: line-through;
    color: var(--ink-mute);
    font-size: 11.5px;
    font-weight: 400;
  }
  .pcard .pct {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    margin-top: 2px;
  }

  /* suggestion chips */
  .suggest {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 2px;
  }
  .suggest button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    transition: all .15s;
  }
  .suggest button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #fff6f3;
  }

  /* thinking text */
  .thinking {
    font-size: 13.5px;
    color: var(--ink-mute);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .thinking .dots::after {
    content: "";
    display: inline-block;
    animation: tdots 1.4s infinite;
  }
  @keyframes tdots {
    0%,20% { content: ""; }
    40% { content: "."; }
    60% { content: ".."; }
    80%,100% { content: "..."; }
  }
  .thinking .dots {
    display: inline-block;
    width: 18px;
  }

  /* input */
  .input-bar {
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .input-wrap {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 6px 6px 6px;
    align-items: flex-end;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,92,58,.1);
  }
  .input-wrap textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--ink);
    padding: 10px 12px;
    font-size: 15px;
    line-height: 1.4;
    max-height: 120px;
    font-family: inherit;
  }
  .input-wrap textarea::placeholder { color: var(--ink-mute); }
  .send {
    background: var(--accent);
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 17px;
    transition: background .15s;
  }
  .send:hover { background: #e94e2e; }

  @media (max-width: 640px) {
    .app { max-width: 100%; }
    .scroll { padding: 18px 16px 12px; }
    .hdr { padding: 14px 16px 12px; }
    .input-bar { padding: 12px 14px 16px; }
    .pcard .thumb { width: 54px; height: 54px; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="hdr">
    <div class="title">Sundek Radar</div>
    <div class="sub">pergunte o que quiser sobre shorts Sundek à venda</div>
  </div>

  <div class="scroll" id="scroll"></div>

  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="ex: shorts pretos M abaixo de R$ 300"></textarea>
      <button class="send" id="send" title="Enviar">→</button>
    </div>
  </div>

</div>

<script>
// ---------- data ----------
const photoBg = {
  preto:     "linear-gradient(135deg,#0f0f0f 0%,#2b2b2b 100%)",
  marinho:   "linear-gradient(135deg,#0b2545 0%,#1f3a6b 100%)",
  azul:      "linear-gradient(135deg,#2f6cb8 0%,#5a95d8 100%)",
  verde:     "linear-gradient(135deg,#2f4a2f 0%,#4f6b4a 100%)",
  oliva:     "linear-gradient(135deg,#5d6b3b 0%,#8a9a60 100%)",
  branco:    "linear-gradient(135deg,#f2f3f5 0%,#d9dce0 100%)",
  vermelho:  "linear-gradient(135deg,#8a1b1b 0%,#c23a3a 100%)",
  amarelo:   "linear-gradient(135deg,#e3b81c 0%,#f5d95a 100%)",
  grafite:   "linear-gradient(135deg,#3a4050 0%,#5a6170 100%)",
  coral:     "linear-gradient(135deg,#ff5c3a,#ff8f6f)",
  "floral-azul": "radial-gradient(circle at 20% 30%,#ff8fa3 0 30%,transparent 31%),radial-gradient(circle at 70% 60%,#a8d8e0 0 34%,transparent 35%),linear-gradient(135deg,#1f3a6b,#0b2545)",
  listrado:  "repeating-linear-gradient(45deg,#0b2545 0 6px,#fff 6px 12px)"
};
const sourceDomain = {
  "Site Oficial": "sundekbrasil.com.br",
  "Dafiti": "dafiti.com.br",
  "Netshoes": "netshoes.com.br"
};
const products = [
  { id:1, title:"Classic Boardshort",  mainColor:"preto", sizes:["P","M","G"], price:289, oldPrice:349, source:"Site Oficial", seenDays:4, tag:"drop", flags:["preto"] },
  { id:2, title:"Rainbow Waistband",   mainColor:"marinho", sizes:["M","G"], price:420, source:"Site Oficial", seenDays:12, flags:["marinho","azul"] },
  { id:3, title:"Low Rise Elastic",    mainColor:"verde", sizes:["M","GG"], price:380, source:"Dafiti", seenDays:1, tag:"novo", flags:["verde"] },
  { id:4, title:"17\" Boardshort",     mainColor:"preto", sizes:["P","M","G","GG"], price:275, oldPrice:325, source:"Dafiti", seenDays:6, tag:"drop", flags:["preto"] },
  { id:5, title:"Logo Elastic Branco", mainColor:"branco", sizes:["M","G"], price:310, source:"Netshoes", seenDays:3, flags:["branco"] },
  { id:6, title:"Classic Fit Preto",   mainColor:"preto", sizes:["M","G","GG"], price:249, source:"Netshoes", seenDays:0, tag:"novo", flags:["preto"] },
  { id:7, title:"Surf Short Estampado",mainColor:"floral-azul", sizes:["P","M"], price:395, source:"Site Oficial", seenDays:8, flags:["estampado","floral","azul"] },
  { id:8, title:"Rainbow Band Black",  mainColor:"preto", sizes:["P","M","G"], price:298, source:"Site Oficial", seenDays:2, flags:["preto"] },
  { id:9, title:"Slim Cut Vermelho",   mainColor:"vermelho", sizes:["M","G"], price:340, source:"Dafiti", seenDays:15, flags:["vermelho"] },
  { id:10, title:"Vintage 90s Listrado", mainColor:"listrado", sizes:["G","GG"], price:460, source:"Site Oficial", seenDays:5, flags:["estampado","listrado"] },
  { id:11, title:"Elastic Classic",    mainColor:"marinho", sizes:["P","M","G"], price:265, oldPrice:295, source:"Netshoes", seenDays:10, tag:"drop", flags:["marinho","azul"] },
  { id:12, title:"Tropical Print",     mainColor:"coral", sizes:["M","G"], price:389, source:"Dafiti", seenDays:7, flags:["estampado","coral"] },
  { id:13, title:"Boardshort Grafite", mainColor:"grafite", sizes:["M","G","GG"], price:299, source:"Site Oficial", seenDays:3, flags:["grafite"] },
  { id:14, title:"Classic Amarelo",    mainColor:"amarelo", sizes:["P","M"], price:358, source:"Site Oficial", seenDays:9, flags:["amarelo"] },
  { id:15, title:"Rainbow Oliva",      mainColor:"oliva", sizes:["M","G"], price:420, source:"Dafiti", seenDays:14, flags:["oliva","verde"] },
  { id:16, title:"Slim Preto Premium", mainColor:"preto", sizes:["M"], price:520, source:"Site Oficial", seenDays:11, flags:["preto"] }
];

// ---------- helpers ----------
const scroll = document.getElementById("scroll");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

const fmtBRL = n => "R$ " + n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const slug = s => s.toLowerCase()
  .replace(/[áàâã]/g,'a').replace(/[éèê]/g,'e').replace(/[íì]/g,'i')
  .replace(/[óòôõ]/g,'o').replace(/[úù]/g,'u').replace(/ç/g,'c')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const urlFor = p => `https://${sourceDomain[p.source]}/p/${slug(p.title)}-${p.id}`;
const scrollBottom = () => requestAnimationFrame(() => { scroll.scrollTop = scroll.scrollHeight; });
const escapeHtml = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ---------- nl parser ----------
function parseQuery(q) {
  const s = q.toLowerCase();
  const f = { colors: [] };
  const map = {
    preto:"preto", preta:"preto", branco:"branco", branca:"branco",
    marinho:"marinho", azul:"azul", verde:"verde",
    vermelho:"vermelho", vermelha:"vermelho", amarelo:"amarelo",
    grafite:"grafite", oliva:"oliva", coral:"coral"
  };
  for (const k in map) if (s.includes(k) && !f.colors.includes(map[k])) f.colors.push(map[k]);
  if (/estamp|floral|listrad|tropical|print/.test(s)) f.estampado = true;
  const sm = s.match(/\b(?:tam(?:anho)?\s*)?(gg|g|m|p)\b/);
  if (sm) f.size = sm[1].toUpperCase();
  const pm = s.match(/(?:at[eé]|abaixo de|menos de|m[aá]x(?:imo)?|<|<=)\s*r?\$?\s*(\d{2,4})/);
  if (pm) f.priceMax = parseInt(pm[1], 10);
  if (/baix(ou|ando|aram)|queda|desconto|drop|promo|caiu/.test(s)) f.onlyDrop = true;
  if (/novo|novos|rec[eé]m|nov[ai]s|chegad|ultim|últim|semana/.test(s)) f.recent = true;
  const nm = s.match(/\b(\d+)\s+(?:shorts?|produtos?|pe[çc]as?|opc?[õo]es?|itens?)/);
  if (nm) f.limit = Math.max(1, Math.min(10, parseInt(nm[1], 10)));
  if (/site oficial/i.test(s)) f.source = "Site Oficial";
  return f;
}
function applyFilters(list, f) {
  return list.filter(p => {
    if (f.colors?.length && !f.colors.some(c => p.flags.includes(c))) return false;
    if (f.estampado && !p.flags.includes("estampado")) return false;
    if (f.size && !p.sizes.includes(f.size)) return false;
    if (f.priceMax && p.price > f.priceMax) return false;
    if (f.onlyDrop && p.tag !== "drop") return false;
    if (f.recent && p.seenDays > 7) return false;
    if (f.source && p.source !== f.source) return false;
    return true;
  });
}
function sortResults(list, f) {
  const l = [...list];
  if (f.onlyDrop) {
    l.sort((a,b) => {
      const da = a.oldPrice ? (a.oldPrice-a.price)/a.oldPrice : 0;
      const db = b.oldPrice ? (b.oldPrice-b.price)/b.oldPrice : 0;
      return db - da;
    });
  } else if (f.recent) {
    l.sort((a,b) => a.seenDays - b.seenDays);
  } else {
    l.sort((a,b) => a.price - b.price);
  }
  return f.limit ? l.slice(0, f.limit) : l;
}

// ---------- render ----------
function pcardHtml(p) {
  const pct = p.oldPrice ? Math.round((1 - p.price/p.oldPrice)*100) : 0;
  const badge = p.tag === "drop" ? `<span class="badge">-${pct}%</span>`
              : p.tag === "novo" ? `<span class="badge novo">novo</span>` : "";
  const bg = photoBg[p.mainColor] || "#333";
  return `
    <a class="pcard" href="${urlFor(p)}" target="_blank" rel="noopener">
      <div class="thumb" style="background:${bg}">${badge}</div>
      <div class="info">
        <div class="title">Sundek ${p.title}</div>
        <div class="meta-row">
          <span>Tam. ${p.sizes.join("·")}</span>
          <span class="dot">•</span>
          <span class="src">${p.source}</span>
          <span class="dot">•</span>
          <span>${p.seenDays === 0 ? "visto hoje" : `há ${p.seenDays}d`}</span>
        </div>
      </div>
      <div class="price-col">
        ${p.oldPrice ? `<span class="price-old">${fmtBRL(p.oldPrice)}</span>` : ""}
        <div class="price">${fmtBRL(p.price)}</div>
      </div>
    </a>
  `;
}

function buildReplyText(f, results) {
  if (!results.length) {
    return `Não achei nada com esses critérios por enquanto. Quer que eu te avise quando aparecer?`;
  }
  const crit = [];
  if (f.colors?.length) crit.push(f.colors.join("/"));
  if (f.estampado) crit.push("estampados");
  if (f.size) crit.push(`tamanho ${f.size}`);
  if (f.priceMax) crit.push(`abaixo de ${fmtBRL(f.priceMax)}`);
  if (f.onlyDrop) crit.push("com queda de preço");
  if (f.recent) crit.push("recém-chegados");
  if (f.source) crit.push(`no ${f.source}`);
  const head = crit.length
    ? `Achei <strong>${results.length}</strong> ${crit.join(", ")}.`
    : `Achei <strong>${results.length}</strong> opções.`;
  const drops = results.filter(p => p.oldPrice);
  let tail = "";
  if (drops.length) {
    const t = drops[0];
    const pct = Math.round((1 - t.price/t.oldPrice)*100);
    tail = ` Vale olhar o <span class="hl">${t.title}</span> — caiu ${pct}% (${fmtBRL(t.oldPrice)} → ${fmtBRL(t.price)}) no ${t.source}.`;
  } else {
    const n = results[0];
    tail = ` O mais em conta é o <span class="hl">${n.title}</span> por ${fmtBRL(n.price)} no ${n.source}.`;
  }
  return head + tail;
}

function userTurn(text) {
  return `<div class="me"><div class="bubble">${escapeHtml(text)}</div></div>`;
}

function thinkingTurn() {
  return `
    <div class="reply" data-thinking="1">
      <div class="thinking">buscando<span class="dots"></span></div>
    </div>
  `;
}

function replyTurn(f, results) {
  const text = buildReplyText(f, results);
  const cards = results.map(pcardHtml).join("");
  const followups = buildFollowups(f, results);
  const chips = followups.length
    ? `<div class="suggest">${followups.map(t => `<button data-chip="${escapeHtml(t)}">${t}</button>`).join("")}</div>`
    : "";
  return `
    <div class="reply">
      <div class="text">${text}</div>
      ${cards ? `<div class="cards">${cards}</div>` : ""}
      ${chips}
    </div>
  `;
}

function buildFollowups(f, results) {
  const out = [];
  if (!f.source) out.push("só do site oficial");
  if (!f.onlyDrop && results.some(p => p.oldPrice)) out.push("só os que baixaram");
  if (!f.recent) out.push("novos dessa semana");
  if (results[0]) out.push(`avisar se baixar de ${fmtBRL(Math.max(200, results[0].price - 30))}`);
  return out.slice(0, 3);
}

// ---------- flow ----------
function append(html) {
  const wrap = document.createElement("div");
  wrap.innerHTML = html.trim();
  while (wrap.firstChild) scroll.appendChild(wrap.firstChild);
  scrollBottom();
}
function removeThinking() {
  const t = scroll.querySelector('[data-thinking="1"]');
  if (t) t.remove();
}

async function ask(text, opts = {}) {
  append(userTurn(text));
  append(thinkingTurn());
  await new Promise(r => setTimeout(r, opts.fast ? 500 : 850));
  removeThinking();
  const f = parseQuery(text);
  const results = sortResults(applyFilters(products, f), f);
  append(replyTurn(f, results));
  wireChips();
}

function wireChips() {
  scroll.querySelectorAll(".suggest button[data-chip]").forEach(b => {
    if (b.dataset.wired) return;
    b.dataset.wired = "1";
    b.addEventListener("click", () => {
      const t = b.dataset.chip;
      let synth = t;
      if (/site oficial/i.test(t)) synth = "mesma busca mas só no site oficial";
      if (/baixaram/i.test(t)) synth = "mesmos mas só os que baixaram de preço";
      if (/novos dessa/i.test(t)) synth = "mostra só os novos dessa semana";
      if (/avisar/i.test(t)) synth = t;
      ask(synth, { fast: true });
    });
  });
}

// ---------- input ----------
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(120, input.scrollHeight) + "px";
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});
sendBtn.addEventListener("click", submit);

function submit() {
  const t = input.value.trim();
  if (!t) return;
  input.value = "";
  input.style.height = "auto";
  ask(t);
}

// ---------- demo opener ----------
(function boot() {
  const q = "acha 4 shorts pretos M abaixo de R$ 300, prioriza os que baixaram de preço";
  append(userTurn(q));
  const f = parseQuery(q);
  const r = sortResults(applyFilters(products, f), f);
  append(replyTurn(f, r));
  wireChips();
})();
</script>
</body>
</html>
